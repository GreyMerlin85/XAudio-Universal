; XAudio Universal 3.5.0 — restart the game after changing settings.
[Wrapper]
; Default engine for all relays. Relative paths are relative to each relay.
; This target must be an XAudio Universal compatible core, never a system audio DLL.
RealDllPath=xaudiouniv.dll

[Features]
; Legacy A3D 1.0/1.2 COM compatibility, not A3D 2/3 wavetracing.
A3D=1
DirectSound=1
DirectSound8=1
DirectSound3D=1
OpenAL=1
OpenALEFX=1
EAX=1
EAX1=1
EAX2=1
EAX3=1
EAX4=1
; Partial EAX5: four sends and slot occlusion, without acoustic MacroFX/PurePath/Voice.
EAX5=1
WaveOut=1
PlaySound=1

[XAudio2]
; XAudio2 is mandatory. There is no WASAPI/OpenAL output backend selector.
SampleRate=48000
; 1, 2, 4, 6 or 8. Use 2 for headphones/HRTF.
Channels=2
PeriodFrames=512
QueueBuffers=4

[DirectSound3D]
; Near-listener diffusion radius in game units; 0 restores point sources.
NearSourceRadius=0.083
; Reference speed in metres/second, combined with DS3D DistanceFactor.
SpeedOfSound=343.3

[Compatibility]
VoiceManagement=0
MaxActiveVoices=64
; Route selected audio COM classes inside this process, without registry edits.
LocalCOM=1

; Optional global admission of playing DirectSound voices, per DirectSound object.
; Explicit TERMINATEBY_PRIORITY/TIME/DISTANCE and VoiceManager AUTO use this limit.

; Disabled by default. PCM front-fill matrix, not Creative CMSS.
; Applies to DirectSound/OpenAL mixer output only, not direct waveOut/PlaySound.
[Enhancements]
StereoUpmix=0
CenterGainPct=35
SurroundGainPct=35
BassManagement=0
BassCutoffHz=80
BassBoostDb=0
LfeGainPct=100

; File next to the core: xaudiouniv.log. Cursor traces can be verbose.
[Diagnostics]
Enabled=0
LogStreaming=1
LogVoices=1
LogCursors=0
